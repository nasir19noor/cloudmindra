services:
  frontend:
    build: ./app/frontend
    container_name: cloudmindra-frontend
    ports:
      - "11000:11000"
    environment:
      - PUBLIC_API_URL=https://api.cloudmindra.com
    restart: unless-stopped

  backend:
    build: ./app/backend
    container_name: cloudmindra-backend
    # host network so the backend reaches the host PostgreSQL on localhost:5432
    # and listens on host port 11001 directly
    network_mode: host
    env_file:
      - ./app/backend/.env
    restart: unless-stopped

  # Background work (DESIGN.md §2.2): outbox relay, job queue, uptime checks.
  # Same image as the backend; WORKER_APPS in .env can limit which module loops it runs.
  worker:
    build: ./app/backend
    container_name: cloudmindra-worker
    network_mode: host
    env_file:
      - ./app/backend/.env
    command: ["sh", "-c", "python migrate.py && exec python worker.py"]
    restart: unless-stopped
