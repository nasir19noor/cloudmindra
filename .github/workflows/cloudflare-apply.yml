name: 'Cloudflare Apply'

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**.tfvars'
      - 'cloudflare/**.tf'
      - '.github/workflows/cloudflare-apply.yml'

env:
  TF_VERSION: '1.11.4'
  AWS_REGION: 'ap-southeast-1'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Cloudflare Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify Cloudflare Token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is not set!"
            exit 1
          else
            echo "CLOUDFLARE_API_TOKEN is set (length: ${#CLOUDFLARE_API_TOKEN} characters)"
          fi

          response=$(curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
               -H "Content-Type: application/json")

          if echo "$response" | grep -q '"success":true'; then
            echo "Cloudflare API token is valid"
          else
            echo "Cloudflare API token validation failed"
            echo "$response"
            exit 1
          fi

      - name: Terraform Init
        working-directory: cloudflare
        run: terraform init

      - name: Terraform Validate
        working-directory: cloudflare
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: cloudflare
        run: terraform plan -no-color -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}"
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        working-directory: cloudflare
        run: terraform apply -auto-approve -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}"
        continue-on-error: false
